<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Memories</title>

    <style>
        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background-color: #fff7f8;
            color: #333;
        }

        .calendar {
            max-width: 500px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h1 {
            margin-bottom: 8px;
        }

        .title p {
            color: #888;
            margin-top: 0;
        }

        .month {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .month h2 {
            margin: 0;
        }

        .month button {
            border: none;
            background: white;
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 10px;
        }

        .month button:hover {
            background-color: #fff0f2;
        }

        .weekdays,
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .weekdays div {
            text-align: center;
            font-size: 13px;
            color: #999;
            padding: 8px 0;
        }

        .day {
            min-height: 55px;
            background-color: white;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }

        .day:hover {
            background-color: #fff0f2;
        }

        .empty {
            min-height: 55px;
        }

        .heart {
    color: #e88;
    font-size: 18px;
    line-height: 1;
}

        /* 기록창 */
        .memory-box {
            margin-top: 25px;
            padding: 20px;
            background-color: white;
            border-radius: 15px;
            display: none;
        }

        .memory-box h3 {
            margin-top: 0;
        }

        /* 하트 버튼 */
        .heart-button {
            width: 100%;
            margin-bottom: 15px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background-color: #fff0f2;
            color: #e88;
            font-size: 15px;
            cursor: pointer;
        }

        .heart-button.active {
            background-color: #f3b6c0;
            color: white;
        }

        /* 사진 업로드 */
        .photo-title {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .photo-input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 10px;
            background-color: #fafafa;
            cursor: pointer;
        }

        .photo-preview {
            margin-top: 12px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .photo-preview img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 10px;
        }

        /* 메모 */
        .memory-label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 100px;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 10px;
            resize: none;
            font-size: 14px;
            font-family: inherit;
        }

        /* 저장 */
        .save-button {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background-color: #f3b6c0;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .save-button:hover {
            background-color: #e9a5b1;
        }
    </style>
</head>

<body>

    <div class="calendar">

        <div class="title">
            <h1>Our Memories ♡</h1>
            <p>우리의 데이트 기록</p>
        </div>


        <!-- 월 이동 -->
        <div class="month">

            <button onclick="previousMonth()">‹</button>

            <h2 id="monthTitle"></h2>

            <button onclick="nextMonth()">›</button>

        </div>


        <!-- 요일 -->
        <div class="weekdays">
            <div>일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div>토</div>
        </div>


        <!-- 날짜 -->
        <div class="days" id="days"></div>


        <!-- 기록창 -->
        <div class="memory-box" id="memoryBox">

            <h3 id="selectedDate"></h3>


            <!-- 하트 -->
            <button
                class="heart-button"
                id="heartButton"
                onclick="toggleHeart()">

                ♡ 데이트한 날로 표시

            </button>


            <!-- 사진 -->
            <label class="photo-title">
                📷 사진
            </label>

            <input
                class="photo-input"
                type="file"
                id="photoInput"
                accept="image/*"
                multiple
                onchange="previewPhotos()"
            >

            <div
                class="photo-preview"
                id="photoPreview">
            </div>


            <!-- 메모 -->
            <label class="memory-label">
                📝 오늘의 기록
            </label>

            <textarea
                id="memoryText"
                placeholder="오늘의 데이트를 기록해보세요 ♡">
            </textarea>


            <!-- 저장 -->
            <button
                class="save-button"
                onclick="saveMemory()">

                기록 저장

            </button>

        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://qvetnbkzxybjvykjctzm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9I3Bhkgpga6yUp5zrYnKfw_xO5cDnQg";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );
</script>
    <script>

        // 현재 보고 있는 달
        let currentYear = 2026;
        let currentMonth = 9;

        // 현재 선택한 날짜
        let selectedDate = "";

        // 하트 상태
        let heartActive = false;

        // 현재 선택한 사진들
        let selectedPhotos = [];


        // =========================
        // 달력 만들기
        // =========================

async function createCalendar() {

    const daysContainer =
        document.getElementById("days");

    daysContainer.innerHTML = "";

    document.getElementById("monthTitle").innerText =
        currentYear + "년 " +
        (currentMonth + 1) + "월";


    // Supabase에서 이번 달 하트 가져오기
    const monthStart =
        currentYear + "-" +
        String(currentMonth + 1).padStart(2, "0") +
        "-01";

    const monthEnd =
        currentYear + "-" +
        String(currentMonth + 1).padStart(2, "0") +
        "-" +
        String(
            new Date(
                currentYear,
                currentMonth + 1,
                0
            ).getDate()
        ).padStart(2, "0");


    const { data: supabaseData, error } =
        await supabaseClient
            .from("memories")
            .select("date, heart")
            .gte("date", monthStart)
            .lte("date", monthEnd);


    if (error) {
        console.error("하트 불러오기 실패:", error);
    }


    // 빈칸
    const firstDay =
        new Date(
            currentYear,
            currentMonth,
            1
        ).getDay();

    for (let i = 0; i < firstDay; i++) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        daysContainer.appendChild(empty);
    }


    // 날짜
    const lastDate =
        new Date(
            currentYear,
            currentMonth + 1,
            0
        ).getDate();


    for (let day = 1; day <= lastDate; day++) {

        const dayElement =
            document.createElement("div");

        dayElement.className = "day";


        const number =
            document.createElement("span");

        number.innerText = day;

        dayElement.appendChild(number);


        const dateKey =
            currentYear + "-" +
            String(currentMonth + 1).padStart(2, "0") +
            "-" +
            String(day).padStart(2, "0");


        // Supabase에서 해당 날짜 찾기
        const savedData =
            supabaseData
                ? supabaseData.find(
                    item => item.date === dateKey
                )
                : null;


        // 하트 표시
        if (savedData && savedData.heart) {

            const heart =
                document.createElement("span");

            heart.className = "heart";

            heart.innerText = "♡";

            dayElement.appendChild(heart);
        }


        // 날짜 클릭
        dayElement.onclick = function() {

            openMemory(dateKey);

        };


        daysContainer.appendChild(dayElement);
    }
}

        // =========================
        // 이전 달
        // =========================

        function previousMonth() {

            currentMonth--;

            if (currentMonth < 0) {

                currentMonth = 11;

                currentYear--;
            }

            createCalendar();
        }


        // =========================
        // 다음 달
        // =========================

        function nextMonth() {

            currentMonth++;

            if (currentMonth > 11) {

                currentMonth = 0;

                currentYear++;
            }

            createCalendar();
        }

        async function openMemory(date) {

    selectedDate = date;

    document.getElementById("memoryBox")
        .style.display = "block";

    const dateParts =
        date.split("-");

    document.getElementById("selectedDate")
        .innerText =
        dateParts[0] + "년 " +
        Number(dateParts[1]) + "월 " +
        Number(dateParts[2]) + "일";


    // Supabase에서 해당 날짜의 메모 불러오기
    const { data, error } =
        await supabaseClient
            .from("memories")
            .select("text, heart")
            .eq("date", date)
            .limit(1);

    if (error) {
        console.error("메모 불러오기 실패:", error);
        alert("메모를 불러오지 못했어요.");
        return;
    }


    if (data && data.length > 0) {

        document.getElementById("memoryText")
            .value =
            data[0].text || "";

        heartActive =
            data[0].heart || false;

    } else {

        document.getElementById("memoryText")
            .value = "";

        heartActive = false;
    }


    // 사진은 아직 기존 방식 유지
    const savedData = getMemory(date);

    if (savedData) {
        selectedPhotos =
            savedData.photos || [];
    } else {
        selectedPhotos = [];
    }


    updateHeartButton();

    showSavedPhotos();
}

        function toggleHeart() {

            heartActive = !heartActive;

            updateHeartButton();
        }


        function updateHeartButton() {

            const button =
                document.getElementById("heartButton");


            if (heartActive) {

                button.innerText =
                    "♥ 데이트한 날로 표시됨";

                button.classList.add("active");

            } else {

                button.innerText =
                    "♡ 데이트한 날로 표시";

                button.classList.remove("active");
            }
        }


        // =========================
        // 사진 미리보기
        // =========================

        function previewPhotos() {

            const input =
                document.getElementById("photoInput");


            const files =
                Array.from(input.files);


            selectedPhotos = [];


            files.forEach(function(file) {

                const reader =
                    new FileReader();


                reader.onload = function(event) {

                    selectedPhotos.push(
                        event.target.result
                    );


                    showPhotos();

                };


                reader.readAsDataURL(file);

            });
        }


        // 사진 화면에 보여주기
        function showPhotos() {

            const preview =
                document.getElementById("photoPreview");


            preview.innerHTML = "";


            selectedPhotos.forEach(function(photo) {

                const image =
                    document.createElement("img");

                image.src = photo;

                preview.appendChild(image);

            });
        }


        // 저장된 사진 보여주기
        function showSavedPhotos() {

            showPhotos();

        }


        // =========================
        // 기록 저장
        // =========================

async function saveMemory() {
    const text = document.getElementById("memoryText").value;

    try {
        // 1. 사진을 Supabase Storage에 업로드
        const uploadedPhotos = [];

        for (let i = 0; i < selectedPhotos.length; i++) {
            const photo = selectedPhotos[i];

            const response = await fetch(photo);
            const blob = await response.blob();

            const fileName =
                selectedDate + "-" +
                Date.now() + "-" +
                i + ".jpg";

            const { error: uploadError } =
                await supabaseClient
                    .storage
                    .from("photos")
                    .upload(fileName, blob, {
                        contentType: "image/jpeg",
                        upsert: true
                    });

            if (uploadError) {
                console.error(uploadError);
                alert("사진 업로드 실패");
                return;
            }

            uploadedPhotos.push(fileName);
        }

        // 2. 내 기기에도 저장
        const data = {
            heart: heartActive,
            text: text,
            photos: selectedPhotos
        };

        localStorage.setItem(
            selectedDate,
            JSON.stringify(data)
        );

        // 3. 기존 기록이 있는지 확인
        const { data: existing, error: selectError } =
            await supabaseClient
                .from("memories")
                .select("id")
                .eq("date", selectedDate)
                .limit(1);

        if (selectError) {
            console.error(selectError);
            alert("Supabase 확인 실패");
            return;
        }

        // 4. 기존 기록이면 수정
        if (existing.length > 0) {

            const { error } =
                await supabaseClient
                    .from("memories")
                    .update({
                        heart: heartActive,
                        text: text,
                        photos: uploadedPhotos
                    })
                    .eq("id", existing[0].id);

            if (error) {
                console.error(error);
                alert("Supabase 저장 실패");
                return;
            }

        } else {

            // 5. 새 기록이면 추가
            const { error } =
                await supabaseClient
                    .from("memories")
                    .insert({
                        date: selectedDate,
                        heart: heartActive,
                        text: text,
                        photos: uploadedPhotos
                    });

            if (error) {
                console.error(error);
                alert("Supabase 저장 실패");
                return;
            }
        }

        alert("기록이 저장됐어요 ♡");
        createCalendar();

    } catch (error) {
        console.error(error);
        alert("저장 중 오류가 발생했어요.");
    }
}

        // =========================
        // 저장된 기록 가져오기
        // =========================

        function getMemory(date) {

            const data =
                localStorage.getItem(date);


            if (!data) {

                return null;
            }


            try {

                return JSON.parse(data);

            } catch {

                return null;
            }
        }


        // 처음 실행
        createCalendar();

    </script>

<script>
    async function testSupabase() {
        const { data, error } = await supabaseClient
            .from("memories")
            .select("*")
            .limit(1);

        if (error) {
            console.error("Supabase 연결 실패:", error);
        } else {
            console.log("Supabase 연결 성공:", data);
        }
    }

    testSupabase();
</script>
</body>
</html>
