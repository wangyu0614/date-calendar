    <script>

        // 현재 보고 있는 달
        let currentYear = 2026;
        let currentMonth = 9;

        // 현재 선택한 날짜
        let selectedDate = "";

        // 하트 상태
        let heartActive = false;

        // 현재 선택한 사진들
        let selectedPhotos = [];
        // 현재 선택한 장소
let selectedPlaceName = "";
let selectedPlaceAddress = "";
let selectedLatitude = null;
let selectedLongitude = null;


        // =========================
        // 달력 만들기
        // =========================

async function createCalendar() {

    const daysContainer =
        document.getElementById("days");

    daysContainer.innerHTML = "";

    document.getElementById("monthTitle").innerText =
        currentYear + "년 " +
        (currentMonth + 1) + "월";


    // Supabase에서 이번 달 하트 가져오기
    const monthStart =
        currentYear + "-" +
        String(currentMonth + 1).padStart(2, "0") +
        "-01";

    const monthEnd =
        currentYear + "-" +
        String(currentMonth + 1).padStart(2, "0") +
        "-" +
        String(
            new Date(
                currentYear,
                currentMonth + 1,
                0
            ).getDate()
        ).padStart(2, "0");


    const { data: supabaseData, error } =
        await supabaseClient
            .from("memories")
            .select("date, heart")
            .gte("date", monthStart)
            .lte("date", monthEnd);


    if (error) {
        console.error("하트 불러오기 실패:", error);
    }


    // 빈칸
    const firstDay =
        new Date(
            currentYear,
            currentMonth,
            1
        ).getDay();

    for (let i = 0; i < firstDay; i++) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        daysContainer.appendChild(empty);
    }


    // 날짜
    const lastDate =
        new Date(
            currentYear,
            currentMonth + 1,
            0
        ).getDate();


    for (let day = 1; day <= lastDate; day++) {

        const dayElement =
            document.createElement("div");

        dayElement.className = "day";


        const number =
            document.createElement("span");

        number.innerText = day;

        dayElement.appendChild(number);


        const dateKey =
            currentYear + "-" +
            String(currentMonth + 1).padStart(2, "0") +
            "-" +
            String(day).padStart(2, "0");


        // Supabase에서 해당 날짜 찾기
        const savedData =
            supabaseData
                ? supabaseData.find(
                    item => item.date === dateKey
                )
                : null;


        // 하트 표시
        if (savedData && savedData.heart) {

            const heart =
                document.createElement("span");

            heart.className = "heart";

            heart.innerText = "♡";

            dayElement.appendChild(heart);
        }


        // 날짜 클릭
        dayElement.onclick = function() {

            openMemory(dateKey);

        };


        daysContainer.appendChild(dayElement);
    }
}

        // =========================
        // 이전 달
        // =========================

        function previousMonth() {

            currentMonth--;

            if (currentMonth < 0) {

                currentMonth = 11;

                currentYear--;
            }

            createCalendar();
        }


        // =========================
        // 다음 달
        // =========================

        function nextMonth() {

            currentMonth++;

            if (currentMonth > 11) {

                currentMonth = 0;

                currentYear++;
            }

            createCalendar();
        }

        async function openMemory(date) {

    selectedDate = date;

    document.getElementById("memoryBox")
        .style.display = "block";

    const dateParts =
        date.split("-");

    document.getElementById("selectedDate")
        .innerText =
        dateParts[0] + "년 " +
        Number(dateParts[1]) + "월 " +
        Number(dateParts[2]) + "일";


    // Supabase에서 해당 날짜의 메모 불러오기
    const { data, error } =
        await supabaseClient
            .from("memories")
            .select("text, heart, place_name, place_address, latitude, longitude")
            .eq("date", date)
            .limit(1);

    if (error) {
        console.error("메모 불러오기 실패:", error);
        alert("메모를 불러오지 못했어요.");
        return;
    }


    if (data && data.length > 0) {

    document.getElementById("memoryText")
        .value =
        data[0].text || "";

    heartActive =
        data[0].heart || false;

    // 저장된 장소 불러오기
    selectedPlaceName =
        data[0].place_name || "";

    selectedPlaceAddress =
        data[0].place_address || "";

    selectedLatitude =
        data[0].latitude || null;

    selectedLongitude =
        data[0].longitude || null;

    // 장소 검색창에 표시
    document.getElementById("placeSearch")
        .value = selectedPlaceName;

    const placeResults =
        document.getElementById("placeResults");

    if (selectedPlaceName) {

        placeResults.style.display = "block";

        placeResults.innerHTML = `
            <div style="
                padding:12px;
                background:#fff7f8;
                border-radius:10px;
            ">
                <strong>${selectedPlaceName}</strong><br>
                <span style="
                    font-size:13px;
                    color:#888;
                ">
                    ${selectedPlaceAddress}
                </span>
            </div>
        `;

    } else {

        placeResults.innerHTML = "";
        placeResults.style.display = "none";
    }

} else {

    document.getElementById("memoryText")
        .value = "";

    heartActive = false;

    // 장소 초기화
    selectedPlaceName = "";
    selectedPlaceAddress = "";
    selectedLatitude = null;
    selectedLongitude = null;

    document.getElementById("placeSearch")
        .value = "";

    document.getElementById("placeResults")
        .innerHTML = "";

    document.getElementById("placeResults")
        .style.display = "none";
}

    // Supabase에 저장된 사진 불러오기
const { data: memoryData, error: photoError } =
    await supabaseClient
        .from("memories")
        .select("photos")
        .eq("date", date)
        .limit(1);

if (photoError) {
    console.error("사진 정보 불러오기 실패:", photoError);
    selectedPhotos = [];
} else if (memoryData && memoryData.length > 0) {
    const photoNames = memoryData[0].photos || [];

    selectedPhotos = [];

    for (const fileName of photoNames) {
        const { data: imageData, error: imageError } =
            await supabaseClient
                .storage
                .from("photos")
                .download(fileName);

        if (imageError) {
            console.error("사진 다운로드 실패:", imageError);
            continue;
        }

        const imageUrl = URL.createObjectURL(imageData);
        selectedPhotos.push(imageUrl);
    }
} else {
    selectedPhotos = [];
}

updateHeartButton();
showSavedPhotos();
}

        function toggleHeart() {

            heartActive = !heartActive;

            updateHeartButton();
        }


        function updateHeartButton() {

            const button =
                document.getElementById("heartButton");


            if (heartActive) {

                button.innerText =
                    "♥ 데이트한 날로 표시됨";

                button.classList.add("active");

            } else {

                button.innerText =
                    "♡ 데이트한 날로 표시";

                button.classList.remove("active");
            }
        }


        // =========================
        // 사진 미리보기
        // =========================

        function previewPhotos() {

            const input =
                document.getElementById("photoInput");


            const files =
                Array.from(input.files);


            selectedPhotos = [];


            files.forEach(function(file) {

                const reader =
                    new FileReader();


                reader.onload = function(event) {

                    selectedPhotos.push(
                        event.target.result
                    );


                    showPhotos();

                };


                reader.readAsDataURL(file);

            });
        }


        // 사진 화면에 보여주기
        function showPhotos() {

            const preview =
                document.getElementById("photoPreview");


            preview.innerHTML = "";


            selectedPhotos.forEach(function(photo) {

                const image =
                    document.createElement("img");

                image.src = photo;

                preview.appendChild(image);

            });
        }


        // 저장된 사진 보여주기
        function showSavedPhotos() {

            showPhotos();

        }

function searchPlace() {
    const keyword = document.getElementById("placeSearch").value.trim();

    if (!keyword) {
        alert("장소를 입력해주세요.");
        return;
    }

    const ps = new kakao.maps.services.Places();

    ps.keywordSearch(keyword, function(data, status) {

        const results = document.getElementById("placeResults");
        results.innerHTML = "";
        results.style.display = "block";

        if (status === kakao.maps.services.Status.ZERO_RESULT) {
            results.innerHTML = "<p>검색 결과가 없어요.</p>";
            return;
        }

        if (status !== kakao.maps.services.Status.OK) {
            results.innerHTML = "<p>장소 검색에 실패했어요.</p>";
            return;
        }

        data.slice(0, 5).forEach(function(place) {

            const item = document.createElement("div");

            item.style.padding = "12px";
            item.style.borderBottom = "1px solid #eee";

async function loadBucketList() {

    const { data, error } =
        await supabaseClient
            .from("date_bucket_list")
            .select("id, title, done")
            .order("created_at", { ascending: true });

    if (error) {
        console.error("버킷리스트 불러오기 실패:", error);
        return;
    }

    const list =
        document.getElementById("bucketList");

    list.innerHTML = "";

    data.forEach(function(item) {

        const div =
            document.createElement("div");

        div.style.cssText = `
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin-bottom: 8px;

            border-radius: 10px;
        `;

        div.innerHTML = `
            <span style="
                font-size: 18px;

            "

                ${item.done ? "☑️" : "⬜"}

}


async function addBucketItem() {

    const input =
        document.getElementById("bucketInput");

    const title =
        input.value.trim();

    if (!title) {
        alert("데이트를 입력해주세요.");
        return;
    }

    const { error } =
        await supabaseClient
            .from("date_bucket_list")
            .insert({
                title: title,
                done: false
            });

    if (error) {
        console.error("버킷리스트 추가 실패:", error);
        alert(error.message);
        return;
    }

    input.value = "";

    loadBucketList();
}


async function toggleBucketItem(id, currentDone) {

    const { error } =
        await supabaseClient
            .from("date_bucket_list")
            .update({
                done: !currentDone
            })
            .eq("id", id);

    if (error) {
        console.error("버킷리스트 수정 실패:", error);
        return;
    }

    loadBucketList();
}

    const { error } =
        await supabaseClient
            .from("date_bucket_list")
            .delete()

}

let statsYear = new Date().getFullYear();
let statsMonth = new Date().getMonth();

async function loadMonthlyStats() {

    const monthStart =
        statsYear + "-" +
        String(statsMonth + 1).padStart(2, "0") +
        "-01";

    const lastDay =
        new Date(
            statsYear,
            statsMonth + 1,
            0
        ).getDate();

    const monthEnd =
        statsYear + "-" +
        String(statsMonth + 1).padStart(2, "0") +
        "-" +
        String(lastDay).padStart(2, "0");


    // 화면의 월 표시
    document.getElementById("statsMonthTitle").innerText =
        statsYear + "년 " +
        (statsMonth + 1) + "월";


    // Supabase에서 해당 월 기록 가져오기
    const { data, error } =
        await supabaseClient
            .from("memories")
            .select(
                "date, heart, place_name, photos, text"
            )
            .gte("date", monthStart)
            .lte("date", monthEnd);


    if (error) {
        console.error("월별 추억 불러오기 실패:", error);
        return;
    }


    // 데이트한 날
    const dateCount =
        data.filter(item => item.heart).length;


    // 장소가 기록된 날
    const placeData =
        data.filter(item =>
            item.place_name
        );

    const placeCount =
        new Set(
            placeData.map(item => item.place_name)
        ).size;


    // 사진이 있는 날
    const photoCount =
        data.filter(item =>
            item.photos &&
            item.photos.length > 0
        ).length;


    // 메모가 있는 날
    const memoCount =
        data.filter(item =>
            item.text &&
            item.text.trim() !== ""
        ).length;


    // 숫자 표시
    document.getElementById("statsDateCount")
        .innerText = dateCount + "일";

    document.getElementById("statsPlaceCount")
        .innerText = placeCount + "곳";

    document.getElementById("statsPhotoCount")
        .innerText = photoCount + "일";

    document.getElementById("statsMemoCount")
        .innerText = memoCount + "일";


    // 장소 목록
    const placesElement =
        document.getElementById("statsPlaces");

    const uniquePlaces =
        [...new Set(
            placeData.map(item => item.place_name)
        )];


    if (uniquePlaces.length === 0) {

        placesElement.innerText =
            "아직 기록된 장소가 없어요.";

    } else {

        placesElement.innerHTML =
            uniquePlaces
                .map(place => "📍 " + place)
                .join("<br>");
    }
}
function changeStatsMonth(direction) {

    statsMonth += direction;

    if (statsMonth < 0) {
        statsMonth = 11;
        statsYear--;
    }

    if (statsMonth > 11) {
        statsMonth = 0;
        statsYear++;
    }

    loadMonthlyStats();
}

<script>
async function showMap() {

    const mapSection =
        document.getElementById("mapSection");

    mapSection.style.display = "block";

    const mapContainer =
        document.getElementById("dateMap");

    const mapOption = {
        center: new kakao.maps.LatLng(37.5665, 126.9780),
        level: 8
    };

    const map =
        new kakao.maps.Map(
            mapContainer,
            mapOption
        );

    // 현재 열려 있는 정보창
    let openInfoWindow = null;

    // Supabase에서 장소 가져오기
    const { data, error } =
        await supabaseClient
            .from("memories")
            .select(
                "date, place_name, place_address, latitude, longitude"
            )
            .not("latitude", "is", null)
            .not("longitude", "is", null);

    if (error) {
        console.error("장소 불러오기 실패:", error);
        alert("장소를 불러오지 못했어요.");
        return;
    }

    console.log("지도에 표시할 장소:", data);

    // 저장된 장소가 없을 때
    if (!data || data.length === 0) {
        alert("저장된 데이트 장소가 아직 없어요.");
        return;
    }

    const bounds = new kakao.maps.LatLngBounds();

    // 장소마다 마커 만들기
    data.forEach(function(place) {

        const position =
            new kakao.maps.LatLng(
                Number(place.latitude),
                Number(place.longitude)
            );

        bounds.extend(position);

        const marker =
            new kakao.maps.Marker({
                map: map,
                position: position
            });

        const infoWindow =
            new kakao.maps.InfoWindow({
                content: `
                    <div
                        onclick="moveToDate('${place.date}')"
                        style="
                            padding:12px;
                            font-size:13px;
                            min-width:170px;
                            cursor:pointer;
                        "
                    >
                        <strong>${place.place_name}</strong>
                        <br>
                        <span style="color:#888;">
                            ${place.place_address || ""}
                        </span>
                        <br>
                        <span style="
                            color:#f3a6b5;
                            display:inline-block;
                            margin-top:5px;
                        ">
                            ${place.date}
                        </span>
                        <br>
                        <span style="
                            color:#aaa;
                            font-size:11px;
                        ">
                            클릭하면 해당 날짜로 이동
                        </span>
                    </div>
                `
            });

        kakao.maps.event.addListener(
            marker,
            "click",
            function() {

                // 다른 정보창 닫기
                if (openInfoWindow) {
                    openInfoWindow.close();
                }

                infoWindow.open(
                    map,
                    marker
                );

                openInfoWindow = infoWindow;
            }
        );
    });

    // 모든 장소가 한 화면에 들어오도록 조정
    map.setBounds(bounds);

    // 지도 다른 곳을 클릭하면 정보창 닫기
    kakao.maps.event.addListener(
        map,
        "click",
        function() {

            if (openInfoWindow) {
                openInfoWindow.close();
                openInfoWindow = null;
            }

        }
    );
}
function moveToDate(date) {

    showSection("calendar");
    openMemory(date);
}
</script>
